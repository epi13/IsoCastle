name: IsoCastle validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Validate project and create Web export
        run: ./tools/build/export_web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Chromium Web smoke test
        run: npx playwright test --project=chromium
      - name: Upload deployable Web archive
        uses: actions/upload-artifact@v4
        with:
          name: IsoCastle-web
          path: builds/web/IsoCastle-web.zip
          if-no-files-found: error
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: IsoCastle-browser-diagnostics
          path: artifacts/browser/
          if-no-files-found: ignore
