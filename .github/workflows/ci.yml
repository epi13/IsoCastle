name: IsoCastle validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Validate content and run headless tests
        run: ./tools/test_all.sh

